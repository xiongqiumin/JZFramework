<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../css/style.css"></head>
<body><div class="drv">
    <h2>OTA 模拟驱动</h2>
    <div class="desc">OTA 升级模拟（占位实现，后续补充进度/校验逻辑）。</div>

    <div class="card">
        <h3>已关联对象</h3>
        <div id="assoc">加载中...</div>
    </div>
    <div class="card">
        <h3>说明</h3>
        <div class="kv">驱动在 begin 时通过 JZSimServer::addAssoc 上报升级任务；finish/cancel 时移除。</div>
    </div>
</div>
<script>
function load(){
    fetch('/sim/state').then(r=>r.json()).then(j=>{
        const st = j.state || {};
        const items = (st.associations||[]).filter(a=>a.category==='ota');
        document.getElementById('assoc').innerHTML = items.length
            ? items.map(a=>`<div class="kv"><span class="k">${a.id}</span><span class="v">${a.label}</span></div>`).join('')
            : '<div class="kv">暂无</div>';
    }).catch(()=>{});
}
load(); setInterval(load, 2000);
</script></body></html>
