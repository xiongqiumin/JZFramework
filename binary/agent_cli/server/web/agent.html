<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent 台账 · JZAgent 管理台</title>
<link rel="stylesheet" href="/ui/tokens.css?v=2">
<link rel="stylesheet" href="/ui/base.css?v=2">
<link rel="stylesheet" href="/ui/components.css?v=2">
<link rel="stylesheet" href="/app.css?v=5">
</head>
<body data-page="agent">
<header class="jz-topbar">
  <div class="jz-brand">
    <span class="jz-brand__logo" id="mono">?</span>
    <div>
      <div class="jz-brand__title"><a href="./" class="back">←</a> <span id="title">agent</span></div>
      <div class="jz-brand__sub" id="meta">加载中…</div>
    </div>
  </div>
  <nav class="jz-tools" id="nav">
    <a class="jz-btn jz-btn--sm" href="./" data-nav="agents">Agent</a>
    <a class="jz-btn jz-btn--sm" href="tasks" data-nav="tasks">Task</a>
    <a class="jz-btn jz-btn--sm jz-btn--primary" href="new" data-nav="new">下发指令</a>
    <button class="jz-btn jz-btn--sm" id="btnRefresh">刷新</button>
  </nav>
</header>

<div class="wrap agent-wrap">
  <nav class="tabs" id="tabs">
    <a class="tab is-on" href="#chat" data-tab="chat">指令流</a>
    <a class="tab" href="#tasks" data-tab="tasks">Task</a>
    <a class="tab" href="#card" data-tab="card">AgentCard</a>
  </nav>

  <section class="pane" data-pane="chat">
    <div class="logbar__hint" id="ctxLine"></div>
    <div class="feed" id="feed"><div class="feed__empty">加载中…</div></div>
    <div class="composer">
      <textarea id="fPrompt" class="jz-textarea composer__ta" rows="2"
        placeholder="给这台 agent 下发一条指令，Ctrl+Enter 发送…"></textarea>
      <div class="composer__row">
        <input id="fVerify" class="jz-input" placeholder="验证命令（可选，退出码 0 = 通过）">
        <button id="btnSubmit" class="jz-btn jz-btn--primary">下发指令</button>
      </div>
      <div class="composer__hint" id="msg"></div>
    </div>
  </section>

  <section class="pane hidden" data-pane="tasks">
    <div class="jz-table-wrap">
      <table class="jz-table">
        <thead><tr><th>Task</th><th>状态</th><th>轮次</th><th>耗时</th><th>提交时间</th></tr></thead>
        <tbody id="taskBody"></tbody>
      </table>
    </div>
    <p class="logbar__hint"><a id="allTasks" href="tasks">在 Task 列表里看全部 →</a></p>
  </section>

  <section class="pane hidden" data-pane="card">
    <div class="jz-card"><div class="jz-card__bd" id="infoBody">加载中…</div></div>
    <h2 class="sec">节点</h2>
    <div class="jz-table-wrap">
      <table class="jz-table">
        <thead><tr><th>节点</th><th>地址</th><th>状态</th><th>工作区</th></tr></thead>
        <tbody id="nodeBody"></tbody>
      </table>
    </div>
    <p class="logbar__hint" id="builtinNote" style="display:none">
      这是 server 进程内置的 agent：任务在本机跑，工具里多了
      <code>server_agents</code> / <code>server_task_submit</code> /
      <code>server_task_query</code> / <code>server_agent_control</code>。
    </p>
  </section>
</div>

<script src="/ui/jz-ui.js?v=2"></script>
<script src="/app.js?v=5"></script>
</body>
</html>
