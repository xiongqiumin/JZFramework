<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务记录 · JZAgent 管理台</title>
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/components.css">
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="tasks">
<header class="jz-topbar">
  <div class="jz-brand">
    <span class="jz-brand__logo">JZ</span>
    <div>
      <div class="jz-brand__title">任务记录</div>
      <div class="jz-brand__sub" id="meta">加载中…</div>
    </div>
  </div>
  <nav class="jz-tools" id="nav">
    <a class="jz-btn jz-btn--sm" href="./" data-nav="agents">Agent</a>
    <a class="jz-btn jz-btn--sm" href="tasks" data-nav="tasks">任务记录</a>
    <a class="jz-btn jz-btn--sm jz-btn--primary" href="new" data-nav="new">新建任务</a>
  </nav>
</header>

<div class="wrap">
  <div class="jz-row" style="flex-wrap:wrap; align-items:flex-end">
    <div class="jz-field" style="flex:0 0 180px">
      <label for="fAgent">agent</label>
      <select id="fAgent" class="jz-input"><option value="">全部</option></select>
    </div>
    <div class="jz-field" style="flex:0 0 160px">
      <label for="fStatus">状态</label>
      <select id="fStatus" class="jz-input">
        <option value="">全部</option>
        <option value="running">running</option>
        <option value="success">success</option>
        <option value="failed">failed</option>
        <option value="cancelled">cancelled</option>
        <option value="lost">lost</option>
      </select>
    </div>
    <div class="jz-field" style="flex:0 0 120px">
      <label for="fLimit">条数</label>
      <input id="fLimit" class="jz-input" type="number" value="50" min="1" max="500">
    </div>
    <button id="btnReload" class="jz-btn">刷新</button>
    <span class="logbar__hint" id="hint"></span>
  </div>

  <div class="jz-table-wrap">
    <table class="jz-table">
      <thead><tr>
        <th>任务</th><th>agent</th><th>状态</th><th>轮次</th><th>耗时</th><th>提交时间</th><th>任务内容</th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <section id="detail" class="hidden">
    <h2 class="sec">任务详情 <button id="btnClose" class="jz-btn jz-btn--sm jz-btn--ghost">关闭</button></h2>
    <div class="jz-card"><div class="jz-card__bd" id="detailBody"></div></div>
  </section>
</div>

<script src="/ui/jz-ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
