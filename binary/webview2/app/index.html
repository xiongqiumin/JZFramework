<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>JZ WebView2</title>
    <style>
        body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 40px; background: #f5f6fa; color: #222; }
        h1 { color: #2c3e50; }
        button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #3498db; color: #fff; cursor: pointer; }
        button:hover { background: #2980b9; }
        pre { background: #fff; padding: 14px; border-radius: 6px; min-height: 24px; }
    </style>
</head>
<body>
    <h1>JZ WebView2 前端</h1>
    <p>本页由本地 JZWebServer（<code>&lt;exeDir&gt;/app</code>）提供。</p>
    <button onclick="callApi()">调用 /api/hello</button>
    <pre id="out">点击按钮测试后端接口…</pre>

    <script>
        async function callApi() {
            const out = document.getElementById('out');
            try {
                const r = await fetch('/api/hello');
                out.textContent = JSON.stringify(await r.json(), null, 2);
            } catch (e) {
                out.textContent = '请求失败: ' + e;
            }
        }
    </script>
</body>
</html>
